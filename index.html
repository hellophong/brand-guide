/* ============================================================
   SPECTRA — design tokens
   Dark-first by intent (the reference UI is a dark chat client).
   Bare :root = dark. Light is redefined at token level only, for
   both the un-stamped OS-light case and the explicit toggle.
   ============================================================ */
:root{
  --sunken:#141519;
  --sidebar:#1c1e23;
  --canvas:#24262c;
  --raised:#2b2e35;
  --raised-2:#33373f;
  --line:#34373e;
  --line-soft:#2a2d33;
  --text:#e6e8ec;
  --text-dim:#a3a8b3;
  --text-faint:#767c88;
  --accent:#7c6bf5;
  --accent-hover:#8d80ff;
  --accent-soft:rgba(124,107,245,.16);
  --on-accent:#fff;
  --good:#3fb27f;
  --warn:#e0a33e;
  --bad:#e05c5c;
  --good-soft:rgba(63,178,127,.14);
  --warn-soft:rgba(224,163,62,.14);
  --bad-soft:rgba(224,92,92,.14);
  --shadow:0 8px 24px rgba(0,0,0,.32);
  --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  --ring:0 0 0 2px var(--canvas),0 0 0 4px var(--accent);
  --checker:rgba(255,255,255,.05);
  --radius:10px;
  --font-ui:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --sunken:#e4e6eb; --sidebar:#f1f2f5; --canvas:#ffffff; --raised:#f7f8fa; --raised-2:#eceef2;
    --line:#dde0e6; --line-soft:#e8eaee;
    --text:#1b1d23; --text-dim:#5b616c; --text-faint:#888e99;
    --accent:#5a48d6; --accent-hover:#4a39c2; --accent-soft:rgba(90,72,214,.12);
    --good:#1f8f5f; --warn:#a9760f; --bad:#c53c3c;
    --shadow:0 6px 18px rgba(20,22,30,.10); --shadow-lg:0 24px 60px rgba(20,22,30,.18);
    --checker:rgba(0,0,0,.05);
  }
}
:root[data-theme="light"]{
  --sunken:#e4e6eb; --sidebar:#f1f2f5; --canvas:#ffffff; --raised:#f7f8fa; --raised-2:#eceef2;
  --line:#dde0e6; --line-soft:#e8eaee;
  --text:#1b1d23; --text-dim:#5b616c; --text-faint:#888e99;
  --accent:#5a48d6; --accent-hover:#4a39c2; --accent-soft:rgba(90,72,214,.12);
  --good:#1f8f5f; --warn:#a9760f; --bad:#c53c3c;
  --shadow:0 6px 18px rgba(20,22,30,.10); --shadow-lg:0 24px 60px rgba(20,22,30,.18);
  --checker:rgba(0,0,0,.05);
}

*{box-sizing:border-box}
/* the hidden attribute must beat any display rule a component sets */
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; background:var(--canvas); color:var(--text);
  font-family:var(--font-ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:none;box-shadow:var(--ring)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ---------- shell ---------- */
.app{display:flex;height:100vh;overflow:hidden}

/* ---------- library sidebar ---------- */
.sidebar{
  width:264px;flex:0 0 264px;background:var(--sidebar);
  display:flex;flex-direction:column;min-height:0;
}
.sb-head{
  height:52px;flex:0 0 52px;display:flex;align-items:center;gap:8px;
  padding:0 16px;border-bottom:1px solid var(--line-soft);box-shadow:0 1px 0 rgba(0,0,0,.12);
}
.sb-head h1{font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em}
.sb-head .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.sb-search{padding:10px 12px 6px}
.sb-search input{
  width:100%;height:32px;border-radius:6px;border:1px solid transparent;background:var(--sunken);
  padding:0 10px;font-size:13.5px;outline:none;
}
.sb-search input::placeholder{color:var(--text-faint)}
.sb-search input:focus{border-color:var(--accent)}
.sb-list{flex:1;overflow-y:auto;padding:4px 8px 8px;min-height:0}
.sb-cat{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:14px 8px 4px;font-size:11px;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;color:var(--text-faint);
}
.sb-item{
  width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;
  color:var(--text-dim);font-size:14.5px;font-weight:500;text-align:left;transition:background .12s,color .12s;
}
.sb-item:hover{background:var(--raised);color:var(--text)}
.sb-item.active{background:var(--raised-2);color:var(--text);font-weight:600}
.sb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-home{margin-bottom:2px}
.sb-pip{font-size:10px;font-weight:800;padding:2px 6px;border-radius:20px;letter-spacing:.03em;text-transform:uppercase}
.pip-review{background:var(--warn-soft);color:var(--warn)}
.pip-queue{background:var(--accent-soft);color:var(--accent)}
.pip-new{background:var(--good-soft);color:var(--good)}
.sb-empty{padding:18px 10px;color:var(--text-faint);font-size:13px;line-height:1.6}

/* account panel, bottom of sidebar */
.sb-user{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--sunken);border-top:1px solid var(--line-soft);
}
.avatar{
  width:32px;height:32px;border-radius:50%;flex:0 0 32px;display:grid;place-items:center;
  font-size:12px;font-weight:800;color:#fff;background:var(--raised-2);position:relative;
}
.avatar.admin{background:var(--accent)}
.avatar::after{
  content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;
  background:var(--text-faint);border:3px solid var(--sunken);box-sizing:content-box;
}
.avatar.admin::after{background:var(--good)}
.sb-user-meta{flex:1;min-width:0;line-height:1.25}
.sb-user-meta b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user-meta span{font-size:11px;color:var(--text-faint)}
.icon-btn{
  width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--text-dim);
  transition:background .12s,color .12s;
}
.icon-btn:hover{background:var(--raised);color:var(--text)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas)}
.topbar{
  height:52px;flex:0 0 52px;display:flex;align-items:stretch;gap:10px;padding:0 16px;
  border-bottom:1px solid var(--line-soft);box-shadow:0 1px 0 rgba(0,0,0,.12);
}
.top-right{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto}
.menu-btn{display:none;align-self:center}
.btn{
  display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:6px;
  font-size:13.5px;font-weight:600;background:var(--raised-2);color:var(--text);
  transition:background .12s,color .12s;white-space:nowrap;
}
.btn:hover{background:var(--line)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.btn-danger:hover{background:var(--bad);color:#fff}
.btn-danger[disabled]{opacity:.45;pointer-events:none}
.danger-box{
  padding:12px 14px;border-radius:var(--radius);background:var(--bad-soft);
  border-left:3px solid var(--bad);margin-bottom:18px;font-size:13px;line-height:1.6;
}
.danger-box b{color:var(--bad)}
.danger-box ul{margin:8px 0 0;padding-left:18px;color:var(--text-dim)}
.btn-ghost{background:transparent;color:var(--text-dim)}
.btn-ghost:hover{background:var(--raised);color:var(--text)}
.btn-lg{height:40px;padding:0 20px;font-size:14.5px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* the tabs are the top row — there is no separate title bar above them */
.tabs{
  display:flex;gap:2px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none;align-items:stretch;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  position:relative;display:flex;align-items:center;padding:0 12px;
  font-size:13.5px;font-weight:600;color:var(--text-faint);
  white-space:nowrap;transition:color .12s;
}
.tab:hover{color:var(--text-dim)}
.tab.active{color:var(--text)}
.tab.active::after{
  content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px;background:var(--accent);
}
.scroll{flex:1;overflow-y:auto;min-height:0}
.page{max-width:1080px;margin:0 auto;padding:28px 28px 96px}

/* ---------- generic content ---------- */
.section{margin-top:40px}
.section:first-child{margin-top:0}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sec-head h3{font-size:19px;font-weight:700;margin:0;letter-spacing:-.015em}
.sec-head .count{font-size:12px;color:var(--text-faint);font-weight:600}
.sec-sub{color:var(--text-dim);font-size:13.5px;margin:0 0 18px;max-width:66ch}
.eyebrow{
  font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);
}
.card{background:var(--raised);border:1px solid var(--line-soft);border-radius:var(--radius)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.meta-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:20px;
  background:var(--raised);border:1px solid var(--line-soft);font-size:12px;font-weight:600;color:var(--text-dim);
}
.chip .mono{font-size:11.5px}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

/* banner */
.banner{
  display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius);
  background:var(--warn-soft);border-left:3px solid var(--warn);margin-bottom:24px;
}
.banner b{display:block;font-size:13.5px;margin-bottom:2px}
.banner p{margin:0;font-size:13px;color:var(--text-dim);max-width:70ch}
.banner .btn{margin-left:auto;flex:0 0 auto}

/* overview grid */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.ov-card{padding:16px;display:flex;flex-direction:column;gap:10px}
.ov-card .eyebrow{margin-bottom:-2px}
.ov-strip{display:flex;height:44px;border-radius:8px;overflow:hidden}
.ov-strip i{flex:1;display:block}
.ov-val{font-size:22px;font-weight:800;letter-spacing:-.02em}
.ov-note{font-size:12.5px;color:var(--text-faint);line-height:1.45}
.meter{height:6px;border-radius:3px;background:var(--raised-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--good)}

/* ---------- color swatches ---------- */
.swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
.swatch{
  text-align:left;border-radius:var(--radius);overflow:hidden;background:var(--raised);
  border:1px solid var(--line-soft);display:flex;flex-direction:column;
  transition:transform .14s ease,box-shadow .14s ease,border-color .14s;
}
.swatch:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line)}
.swatch:focus-visible{box-shadow:var(--ring)}
.chip-well{
  height:112px;position:relative;display:flex;align-items:flex-end;justify-content:space-between;
  padding:10px;gap:8px;
}
.copy-hint{
  font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  padding:4px 8px;border-radius:20px;background:rgba(0,0,0,.28);color:#fff;
  opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s;
}
.chip-well.on-light .copy-hint{background:rgba(255,255,255,.55);color:#111}
.swatch:hover .copy-hint,.swatch:focus-visible .copy-hint{opacity:1;transform:translateY(0)}
.contrast-tag{
  font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:5px;letter-spacing:.03em;
  background:rgba(0,0,0,.28);color:#fff;
}
.chip-well.on-light .contrast-tag{background:rgba(255,255,255,.55);color:#111}
.swatch-body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:8px}
.swatch-name{font-size:14px;font-weight:700;letter-spacing:-.01em}
.swatch-role{font-size:12px;color:var(--text-faint);line-height:1.45}
.val-list{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.val{
  display:flex;align-items:center;gap:8px;width:100%;padding:4px 6px;border-radius:5px;
  font-size:12px;text-align:left;transition:background .12s;
}
.val:hover{background:var(--raised-2)}
.val .k{width:52px;flex:0 0 52px;font-size:10.5px;font-weight:800;letter-spacing:.05em;color:var(--text-faint);text-transform:uppercase}
.val .v{flex:1;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val .src{font-size:11px;color:var(--text-faint);opacity:.75}
.val:hover .src{opacity:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-faint);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- typography ---------- */
.seg{display:inline-flex;padding:3px;background:var(--sunken);border-radius:8px;gap:2px}
.seg button{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;color:var(--text-dim)}
.seg button.active{background:var(--raised-2);color:var(--text)}
.type-row{padding:20px;margin-bottom:12px;display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.type-spec{flex:0 0 216px;display:flex;flex-direction:column;gap:8px}
.type-spec .role{font-size:14px;font-weight:700}
.type-spec .fam{font-size:13px;color:var(--text-dim)}
.spec-table{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;margin-top:2px}
.spec-table dt{color:var(--text-faint);font-weight:600}
.spec-table dd{margin:0;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--text-dim)}
.type-sample{flex:1;min-width:240px;color:var(--text);overflow:hidden}
.type-usage{
  flex-basis:100%;font-size:12.5px;color:var(--text-faint);border-top:1px solid var(--line-soft);
  padding-top:12px;line-height:1.5;
}
.scale-note{
  font-size:12.5px;color:var(--text-faint);background:var(--raised);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:12px 14px;margin-top:16px;line-height:1.55;
}

/* ---------- logo ---------- */
.logo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.logo-stage{
  padding:28px;display:grid;place-items:center;min-height:180px;border-radius:var(--radius);
  background:var(--raised);border:1px solid var(--line-soft);
}
.logo-stage.inverse{background:#141519}
.logo-stage.tint{background:var(--accent-soft)}
.stage-cap{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  font-size:12px;color:var(--text-faint);margin-top:8px;
}
.stage-cap span:first-child{white-space:nowrap}
.stage-cap span:last-child{text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.rule{padding:14px;border-radius:var(--radius);border:1px solid var(--line-soft);background:var(--raised)}
.rule .head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px}
.rule.do .head{color:var(--good)}
.rule.dont .head{color:var(--bad)}
.rule-stage{
  height:104px;border-radius:8px;background:var(--raised-2);display:grid;place-items:center;
  overflow:hidden;margin-bottom:10px;
}
.rule p{margin:0;font-size:12.5px;color:var(--text-faint);line-height:1.5}
.clearspace{position:relative;display:inline-grid;place-items:center;padding:32px}
.clearspace::before{
  content:"";position:absolute;inset:0;border:1px dashed var(--accent);border-radius:4px;opacity:.7;
}
.cs-tag{
  position:absolute;font-size:10px;font-weight:800;color:var(--accent);background:var(--raised);
  padding:0 4px;font-family:var(--font-mono);
}

/* ---------- assets ---------- */
.file-row{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-soft);
}
.file-row:last-child{border-bottom:none}
.file-ico{
  width:36px;height:36px;flex:0 0 36px;border-radius:8px;display:grid;place-items:center;
  background:var(--raised-2);font-size:10px;font-weight:800;letter-spacing:.02em;color:var(--text-dim);
}
/* uploaded artwork previews itself; everything else shows its extension */
.file-thumb{background:var(--checker);padding:3px;overflow:hidden}
.file-thumb img{width:100%;height:100%;object-fit:contain;display:block}
.file-meta{flex:1;min-width:0}
.file-meta b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta span{font-size:12px;color:var(--text-faint)}
.drop-inline{padding:24px 20px}
.drop-inline .big{font-size:22px;margin-bottom:6px}

/* ---------- home / all brands ---------- */
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.brand-card{
  text-align:left;border-radius:var(--radius);overflow:hidden;background:var(--raised);
  border:1px solid var(--line-soft);transition:transform .14s,box-shadow .14s,border-color .14s;
}
.brand-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line)}
.bc-strip{display:flex;height:72px}
.bc-strip i{flex:1}
.bc-body{padding:12px 14px 14px;display:flex;gap:11px;align-items:flex-start}
.bc-mark{width:36px;height:36px;flex:0 0 36px;border-radius:10px;display:grid;place-items:center;background:var(--raised-2)}
.bc-text{flex:1;min-width:0}
.bc-text b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em}
.bc-text span{font-size:12px;color:var(--text-faint)}

/* ---------- admin portal ---------- */
.tab-count{
  display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;
  border-radius:9px;background:var(--accent);color:var(--on-accent);
  font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums;
}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:28px}
.stat{padding:14px 16px;border-radius:var(--radius);background:var(--raised);border:1px solid var(--line-soft)}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .l{font-size:11.5px;color:var(--text-faint);font-weight:600;margin-top:2px}
.job{
  padding:16px;border-radius:var(--radius);background:var(--raised);
  border:1px solid var(--line-soft);margin-bottom:12px;
}
.job-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar{height:5px;border-radius:3px;background:var(--raised-2);overflow:hidden;margin:14px 0 9px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .45s ease}
.job-stage{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text-dim)}
.rev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;margin-top:16px}
.flag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--warn-soft);color:var(--warn)}
.empty{
  padding:44px 20px;text-align:center;color:var(--text-faint);font-size:13.5px;
  border:1px dashed var(--line);border-radius:var(--radius);
}
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line-soft);background:var(--raised)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}
.tbl th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--text-faint);font-weight:800;padding:12px 14px;
}
.tbl td{padding:11px 14px;border-top:1px solid var(--line-soft);vertical-align:middle}
.tbl tbody tr:hover td{background:var(--raised-2)}
.tbl .name{font-weight:600}
.tbl .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-dim)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.log li:last-child{border-bottom:none}
.log time{
  flex:0 0 84px;color:var(--text-faint);font-size:12px;
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;
}
.log .who{font-weight:600}

/* ---------- modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(8,9,12,.72);backdrop-filter:blur(2px);
  display:none;place-items:center;padding:24px;z-index:100;
}
.overlay.open{display:grid;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:480px;background:var(--canvas);border-radius:14px;box-shadow:var(--shadow-lg);
  overflow:hidden;animation:pop .2s cubic-bezier(.2,.9,.3,1.2);max-height:88vh;display:flex;flex-direction:column;
}
.modal.wide{max-width:620px}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.modal-head{padding:22px 22px 6px;text-align:center}
.modal-head.left{text-align:left}
.modal-head h3{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.modal-head p{margin:0;font-size:14px;color:var(--text-dim)}
.modal-body{padding:18px 22px;overflow-y:auto;flex:1;min-height:0}
.modal-foot{
  padding:16px 22px;background:var(--sidebar);display:flex;align-items:center;justify-content:flex-end;gap:10px;
}
.modal-foot .spacer{flex:1}
.field{margin-bottom:16px}
.field label{
  display:block;font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
  color:var(--text-dim);margin-bottom:7px;
}
.field input{
  width:100%;height:40px;border-radius:5px;border:1px solid var(--sunken);background:var(--sunken);
  padding:0 11px;outline:none;font-size:15px;
}
.field input:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--text-faint);margin-top:8px;line-height:1.5}
.hint code{font-family:var(--font-mono);background:var(--raised-2);padding:1px 5px;border-radius:4px;font-size:11.5px}
.sso{display:flex;gap:8px;margin-bottom:16px}
.sso .btn{flex:1;justify-content:center}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--text-faint);font-size:11px;font-weight:700;letter-spacing:.06em}
.login-error{
  margin:0 0 14px;padding:10px 12px;border-radius:6px;font-size:13px;line-height:1.45;
  background:var(--bad-soft);color:var(--bad);border-left:3px solid var(--bad);
}
.mode-pill{
  font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:20px;background:var(--raised-2);color:var(--text-faint);
}
.mode-pill.live{background:var(--good-soft);color:var(--good)}
.mode-pill.demo{background:var(--warn-soft);color:var(--warn)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* dropzone */
.drop{
  border:2px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;
  background:var(--raised);transition:border-color .15s,background .15s;cursor:pointer;
}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{font-size:30px;margin-bottom:8px;line-height:1}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.drop span{font-size:12.5px;color:var(--text-faint)}

/* pipeline */
.pipe{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:12px;padding:9px 4px;font-size:13.5px;color:var(--text-faint)}
.step .dot{
  width:20px;height:20px;flex:0 0 20px;border-radius:50%;display:grid;place-items:center;
  background:var(--raised-2);font-size:11px;font-weight:800;color:var(--text-faint);
}
.step.run{color:var(--text)}
.step.run .dot{background:var(--accent-soft);color:var(--accent)}
.step.done{color:var(--text-dim)}
.step.done .dot{background:var(--good);color:#fff}
.step .t{flex:1}
.step .ms{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.spin{
  width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);border-top-color:transparent;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* review list */
.rev-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;background:var(--raised);margin-bottom:8px}
.rev-sw{width:40px;height:40px;flex:0 0 40px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.rev-meta{flex:1;min-width:0}
.rev-meta b{display:block;font-size:13.5px;font-weight:600}
.rev-meta span{font-size:11.5px;font-family:var(--font-mono);color:var(--text-faint)}
.conf{font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px}

/* toast */
.toasts{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:8px;
  background:var(--sunken);color:var(--text);box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:600;
  border:1px solid var(--line);animation:rise .22s cubic-bezier(.2,.9,.3,1.2);
  max-width:min(90vw,540px);
}
.toast>span:not(.mono){white-space:nowrap}
.toast .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast .sw{width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.toast .mono{font-size:12.5px;color:var(--text-dim)}

/* responsive */
.scrim{display:none}
@media (max-width:900px){
  .sidebar{
    position:fixed;top:0;bottom:0;left:0;z-index:60;transform:translateX(-100%);transition:transform .2s ease;
  }
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
  .menu-btn{display:grid}
  .page{padding:20px 16px 80px}
}
@media (max-width:600px){
  .topbar{padding:0 10px;gap:6px}
  .tab{padding:0 9px;font-size:13px}
}
</style>

<div class="app">
  <!-- library sidebar -->
  <aside class="sidebar">
    <div class="sb-head"><span class="dot"></span><h1>Spectra</h1><span class="mode-pill" id="modePill" style="margin-left:auto">…</span></div>

      <input id="search" type="search" placeholder="Search brands, colors, fonts" aria-label="Search the library">

        <button class="icon-btn" id="themeBtn" title="Switch theme" aria-label="Switch theme"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
        <div id="authSlot"></div>
      </div>

    <div class="scroll" id="scroll"><div class="page" id="page"></div></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>

<!-- login -->
<div class="overlay" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
  <div class="modal">
    <div class="modal-head">
      <h3 id="loginTitle">Welcome back</h3>
      <p>Sign in to publish and edit brands.</p>
    </div>
    <div class="modal-body">
      <div class="sso" id="ssoRow">
        <button class="btn" style="flex:1;justify-content:center" data-sso="Google Workspace">Google Workspace</button>
        <button class="btn" style="flex:1;justify-content:center" data-sso="Okta">Okta SSO</button>
      </div>
      <div class="divider" id="ssoDivider">OR</div>
      <form id="loginForm">
        <div class="field">

          <input id="loginEmail" type="email" autocomplete="username" required>

          <label for="loginPass">Password</label>
          <input id="loginPass" type="password" autocomplete="current-password" required>

        <button class="btn btn-primary btn-lg" id="loginSubmit" type="submit" style="width:100%;justify-content:center">Sign in</button>

</div>

<!-- delete a brand -->
<div class="overlay" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="delTitle">
  <div class="modal">
    <div class="modal-head left">
      <h3 id="delTitle">Delete this brand?</h3>

      <span class="spacer"></span>
      <button class="btn" id="delCancel">Cancel</button>
      <button class="btn btn-danger" id="delConfirmBtn" disabled>Delete permanently</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script>
"use strict";

/* =============================================================
   1. COLOR MATH
   Stated values (printed in the guide) always win. Anything we
   compute is labelled as derived, so nobody sends a machine
   guess to a printer by accident.
   ============================================================= */
const hex2rgb = h => {
  const s = h.replace("#","");
  const n = parseInt(s.length === 3 ? s.split("").map(c=>c+c).join("") : s, 16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
};
const rgbStr = h => { const c = hex2rgb(h); return `${c.r}, ${c.g}, ${c.b}`; };
const cmykStr = h => {
  const {r,g,b} = hex2rgb(h);
  const R=r/255, G=g/255, B=b/255;
  const k = 1 - Math.max(R,G,B);
  if (k === 1) return "0, 0, 0, 100";
  const c = (1-R-k)/(1-k), m = (1-G-k)/(1-k), y = (1-B-k)/(1-k);
  return [c,m,y,k].map(v=>Math.round(v*100)).join(", ");
};
const hslStr = h => {
  const {r,g,b} = hex2rgb(h);
  const R=r/255,G=g/255,B=b/255, mx=Math.max(R,G,B), mn=Math.min(R,G,B), d=mx-mn;
  let hu=0;
  if (d) hu = mx===R ? ((G-B)/d+(G<B?6:0)) : mx===G ? ((B-R)/d+2) : ((R-G)/d+4);
  const l=(mx+mn)/2, s = d ? d/(1-Math.abs(2*l-1)) : 0;
  return `${Math.round(hu*60)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%`;
};
const lum = h => {
  const {r,g,b} = hex2rgb(h);
  const f = v => { v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); };
  return .2126*f(r) + .7152*f(g) + .0722*f(b);
};
const contrast = (a,b) => { const L1=lum(a), L2=lum(b); return (Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05); };
const isLight = h => lum(h) > .45;
/* Best foreground for text sitting on this color, plus the WCAG grade. */
const onColor = h => {
  const w = contrast(h,"#FFFFFF"), k = contrast(h,"#111111");
  const fg = w >= k ? "#FFFFFF" : "#111111", ratio = Math.max(w,k);
  return { fg, ratio, grade: ratio>=7 ? "AAA" : ratio>=4.5 ? "AA" : ratio>=3 ? "AA Large" : "Fails" };
};
const hsl2hex = (h,s,l) => {
  h=((h%360)+360)%360; s/=100; l/=100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  const seg=[[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][Math.floor(h/60)%6];
  return "#" + seg.map(v=>Math.round((v+m)*255).toString(16).padStart(2,"0")).join("").toUpperCase();
};

function markSVG(brand, size, fill, alt){

    /* 2 — health: rounded cross */
    `<rect x="6" y="6" width="52" height="52" rx="18" fill="${c}"/><path d="M27 17h10v10h10v10H37v10H27V37H17V27h10z" fill="${a}"/>`,

function lockup(brand, size, color, alt){
  const stack = (brand.type.digital[0] || {}).stack || "inherit";

/* =============================================================

   ============================================================= */
async function copy(text, label, swatch){
  let ok = true;
  try{
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
    else {
      const ta = el("textarea"); ta.value = text;
      ta.style.cssText = "position:fixed;opacity:0;pointer-events:none";
      document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove();
    }
  }catch(e){ ok = false; }
  /* a whole palette export is too big to echo — summarise it instead */
  const preview = text.length > 48
    ? `${text.split("\n").length} lines · ${text.length} characters`
    : text;
  toast(ok ? `Copied ${label}` : "Press ⌘C to copy", preview, ok ? swatch : null, !ok);
}
function toast(title, value, swatch, isWarn){
  const t = el("div","toast");
  if (swatch) t.appendChild(el("i","sw")).style.background = swatch;
  t.appendChild(el("span",null,esc(title)));
  if (value) t.appendChild(el("span","mono",esc(value)));
  if (isWarn) t.style.borderColor = "var(--warn)";
  $("#toasts").appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .2s,transform .2s"; t.style.opacity=0; t.style.transform="translateY(6px)";
    setTimeout(()=>t.remove(),220); }, 2100);
}

/* =============================================================
   6. RENDER — rail, sidebar, header
   ============================================================= */
function renderSidebar(){
  const list = $("#sbList"); list.innerHTML = "";
  const q = state.query.trim().toLowerCase();
  const match = b => !q || b.name.toLowerCase().includes(q) || b.tagline.toLowerCase().includes(q) ||
    allColors(b).some(c => c.name.toLowerCase().includes(q) || c.hex.toLowerCase().includes(q)) ||
    [...b.type.digital, ...b.type.print].some(t => t.family.toLowerCase().includes(q));

  const published = visibleBrands().filter(b => b.status==="published" && match(b));
  const review    = visibleBrands().filter(b => b.status!=="published" && match(b));

  const row = b => {
    const btn = el("button","sb-item" + (state.view===b.id ? " active":""));
    btn.innerHTML = `<span class="sb-name">${esc(b.name)}</span>
      ${b.status==="review" ? '<span class="sb-pip pip-review">Review</span>' : ""}`;
    btn.onclick = () => go(b.id);
    return btn;
  };

  const home = el("button","sb-item sb-home" + (state.view==="home" ? " active":""),
    `<span class="sb-name">All brands</span>`);
  home.onclick = () => go("home");
  list.appendChild(home);

  if (state.admin){
    const n = adminAttention();
    const portal = el("button","sb-item" + (state.view==="admin" ? " active":""),
      `<span class="sb-name">Admin portal</span>${n ? `<span class="sb-pip pip-queue">${n}</span>` : ""}`);
    portal.onclick = () => go("admin");
    list.appendChild(portal);
  }

  if (published.length){
    list.appendChild(el("div","sb-cat",`<span>Published — ${published.length}</span>`));
    published.forEach(b => list.appendChild(row(b)));
  }
  if (review.length){
    list.appendChild(el("div","sb-cat",`<span>Needs review — ${review.length}</span>`));
    review.forEach(b => list.appendChild(row(b)));
  }
  if (!published.length && !review.length){
    list.appendChild(el("div","sb-empty",`No brand matches <b>${esc(state.query)}</b>.<br>Search covers brand names, colour names, hex values and typeface names.`));
  }

  const u = $("#sbUser");
  const email = state.user && state.user.email;
  const initials = email ? email.slice(0,2).toUpperCase() : "GU";
  u.innerHTML = state.user || state.admin
    ? `<div class="avatar${state.admin ? " admin" : ""}">${esc(initials)}</div>
       <div class="sb-user-meta">
         <b>${esc(email || "Studio Admin")}</b>
         <span>${state.admin ? "Can publish · Can edit" : "Signed in · Read only"}</span>
       </div>
       <button class="icon-btn" id="logoutBtn" title="Sign out" aria-label="Sign out">⏻</button>`
    : `<div class="avatar">GU</div>
       <div class="sb-user-meta"><b>Guest</b><span>Read only</span></div>
       <button class="icon-btn" id="loginBtn2" title="Sign in" aria-label="Sign in">→</button>`;
  const lo = $("#logoutBtn"); if (lo) lo.onclick = signOut;
  const li = $("#loginBtn2"); if (li) li.onclick = () => openLogin();
}

function renderHeader(){
  const b = brandById(state.view);
  $("#authSlot").innerHTML = state.admin
    ? `<button class="btn btn-primary" id="addBtn">＋ Add brand</button>`
    : `<button class="btn btn-primary" id="loginBtn">Log in</button>`;
  const ab = $("#addBtn");   if (ab) ab.onclick = () => go("admin","upload");
  const lb = $("#loginBtn"); if (lb) lb.onclick = () => openLogin();

  const tabs = $("#tabs"); tabs.innerHTML = "";
  const pill = n => n ? ` <span class="tab-count">${n}</span>` : "";
  const defs = state.view === "admin"
    ? [["upload","Upload"],["queue","Processing" + pill(jobsRunning())],
       ["review","Needs review" + pill(jobsToReview())],["brands","Brands"],["activity","Activity"]]
    : b

/* =============================================================
   7. RENDER — page bodies
   ============================================================= */
function renderPage(keepScroll){
  const page = $("#page");
  const y = $("#scroll").scrollTop;
  page.innerHTML = "";
  $("#scroll").scrollTop = keepScroll ? y : 0;
  if (state.view === "admin") return renderAdmin(page);
  const b = brandById(state.view);
  if (!b) return state.tab==="how" ? renderHow(page) : renderHome(page);

  if (b.status==="review"){
    const banner = el("div","banner");
    banner.innerHTML = `<span style="font-size:18px;line-height:1">⚠</span>
      <div><b>Extracted, not yet approved</b>
      <p>Spectra read this guide with ${b.source.confidence}% confidence. Values are visible to admins only until someone signs them off. Nothing here should go to a printer yet.</p></div>`;
    if (state.admin){
      const btn = el("button","btn btn-primary","Approve and publish");
      btn.onclick = () => { b.status = "published"; renderAll(); toast("Published to the library", b.name, allColors(b)[0].hex); };
      banner.appendChild(btn);
    }
    page.appendChild(banner);
  }

  ({ logo:renderLogo, color:renderColor, type:renderType, assets:renderAssets }[state.tab] || renderLogo)(page, b);
}

function renderHome(page){

/* Section heading for a brand page. With no title bar above the tabs, this is
   the only thing naming the brand you are looking at, so every tab carries it. */
function brandHead(b, title, count, sub){
  const head = el("div","section");
  head.innerHTML = `<span class="eyebrow">${esc(b.name)}</span>
    <div class="sec-head"><h3>${esc(title)}</h3>${count ? `<span class="count">${esc(count)}</span>` : ""}</div>
    ${sub ? `<p class="sec-sub">${esc(sub)}</p>` : ""}`;

/* ---- colour ---- */
function swatchCard(c){
  const on = onColor(c.hex);
  const card = el("button","swatch");
  card.setAttribute("aria-label", `Copy ${c.name}, hex ${c.hex}`);
  const stated = !!c.cmyk;
  const vals = [
    ["HEX",  c.hex.toUpperCase(), "📄"],
    ["RGB",  rgbStr(c.hex), "📄"],
    ["CMYK", c.cmyk || cmykStr(c.hex), stated ? "📄" : "⚙"],
    ["HSL",  hslStr(c.hex), "⚙"]
  ];
  if (c.pantone) vals.push(["Pantone", c.pantone, "📄"]);

  card.innerHTML = `
    <span class="chip-well${isLight(c.hex) ? " on-light":""}" style="background:${c.hex}">
      <span class="copy-hint">Click to copy</span>
      <span class="contrast-tag" title="Contrast against ${on.fg==="#FFFFFF"?"white":"black"}">${on.grade} ${on.ratio.toFixed(1)}:1</span>
    </span>
    <span class="swatch-body">
      <span class="swatch-name">${esc(c.name)}</span>
      ${c.note ? `<span class="swatch-role">${esc(c.note)}</span>` : ""}
      <span class="val-list">
        ${vals.map(([k,v,s]) => `<span class="val" data-copy="${esc(v)}" data-label="${esc(k)}" title="Copy ${esc(k)}">
            <span class="k">${k}</span><span class="v">${esc(v)}</span><span class="src" title="${s==="📄"?"Stated in the guide":"Derived by Spectra"}">${s}</span>
          </span>`).join("")}
      </span>
    </span>`;

  card.onclick = e => {
    const hit = e.target.closest(".val");
    if (hit) copy(hit.dataset.copy, `${c.name} ${hit.dataset.label}`, c.hex);
    else copy(c.hex.toUpperCase(), `${c.name} HEX`, c.hex);
  };
  return card;
}

function renderColor(page, b){
  page.appendChild(brandHead(b, "Colour", `${allColors(b).length} swatches`,
    "Click a swatch to copy its hex. Click a single row to copy just that value. Contrast badges are measured against whichever of black or white performs better on that colour."));

  b.colors.forEach(group => {
    const sec = el("div","section");
    sec.innerHTML = `<div class="sec-head"><h3 style="font-size:15px">${esc(group.group)}</h3><span class="count">${group.items.length}</span></div>`;
    const grid = el("div","swatch-grid");
    group.items.forEach(c => grid.appendChild(swatchCard(c)));
    sec.appendChild(grid);
    page.appendChild(sec);
  });

  const legend = el("div","legend");
  legend.innerHTML = `<span>📄 Stated in the guide — read off the page</span>
    <span>⚙ Derived by Spectra — a conversion, not a print-matched build</span>
    <span>Contrast badges follow WCAG 2.2</span>`;
  page.appendChild(legend);

  const exp = el("div","section");
  exp.innerHTML = `<div class="sec-head"><h3>Take the whole palette</h3></div>
    <p class="sec-sub">Same values, in the format your tool actually wants.</p>`;
  const bar = el("div","meta-row");
  const formats = {
    "CSS variables": () => allColors(b).map(c => `  --${slug(c.name)}: ${c.hex.toUpperCase()};`).join("\n").replace(/^/,":root{\n") + "\n}",
    "Design tokens (JSON)": () => JSON.stringify(Object.fromEntries(allColors(b).map(c => [slug(c.name), {$type:"color", $value:c.hex.toUpperCase()}])), null, 2),
    "Tailwind config": () => "colors: {\n" + allColors(b).map(c=>`  "${slug(c.name)}": "${c.hex.toUpperCase()}",`).join("\n") + "\n}",
    "SCSS": () => allColors(b).map(c => `$${slug(c.name)}: ${c.hex.toUpperCase()};`).join("\n")
  };
  Object.entries(formats).forEach(([label, fn]) => {

    bar.appendChild(btn);

  exp.appendChild(bar);
  page.appendChild(exp);
}
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");

/* ---- typography ---- */
function renderType(page, b){
  const head = brandHead(b, "Typography", null,
    "Print and digital are different specifications of the same voice — point sizes and leading for one, pixels and line-height for the other. Switch between them here.");
  const seg = el("div","seg");
  [["digital","Digital"],["print","Print"]].forEach(([id,label]) => {
    const btn = el("button", state.typeMode===id ? "active" : null, label);
    btn.onclick = () => { state.typeMode = id; renderPage(); };
    seg.appendChild(btn);
  });
  head.appendChild(seg);
  page.appendChild(head);

  const rows = b.type[state.typeMode] || [];
  const wrap = el("div","section"); wrap.style.marginTop = "20px";
  rows.forEach(t => {
    const isPrint = state.typeMode === "print";
    const px = isPrint ? Math.round(parseFloat(t.specs.Size) * 1.34) : parseInt(t.specs.Size, 10);
    const display = Math.max(15, Math.min(px, 56));
    const row = el("div","card type-row");
    row.innerHTML = `
      <div class="type-spec">
        <span class="role">${esc(t.role)}</span>
        <span class="fam">${esc(t.family)}</span>
        <dl class="spec-table">${Object.entries(t.specs).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      </div>
      <div class="type-sample" style="font-family:${t.stack};font-weight:${t.weight};font-size:${display}px;line-height:1.15;letter-spacing:${(t.specs.Tracking||"0").includes("em")?t.specs.Tracking:"0"};${(t.specs.Case==="Uppercase")?"text-transform:uppercase;":""}">${esc(t.sample)}</div>
      <div class="type-usage"><b>When to use it —</b> ${esc(t.usage)}</div>`;
    wrap.appendChild(row);
  });
  page.appendChild(wrap);

  const note = el("div","scale-note");
  note.innerHTML = `<b>About this specimen —</b> these samples render in the faces named above (${esc([...new Set(rows.map(r=>r.family))].join(", "))}), embedded in this file as latin subsets under the SIL Open Font License. A production build serves the brand's own licensed webfonts the same way, from its asset bucket.${state.typeMode==="print" ? " Print sizes are shown here scaled to screen; the point sizes in the table are the specification." : ""}`;
  page.appendChild(note);
}

/* ---- assets ---- */
function renderAssets(page, b){
  const head = brandHead(b, "Assets", `${b.assets.length} files`,
    "Everything extracted from the guide, plus the source PDF itself. In a live build these are signed download links that expire, so nothing leaks past the people you shared it with.");
  /* provenance for the whole brand lives here, next to the document it came from */
  const meta = el("div","meta-row");
  meta.innerHTML = `<span class="chip">📄 <span class="mono">${esc(b.source.file)}</span></span>
    <span class="chip">${b.source.pages} pages</span>
    <span class="chip">Extracted ${esc(b.source.extracted)}</span>
    <span class="chip ${b.source.confidence>=90?"good":b.source.confidence>=80?"warn":"bad"}">${b.source.confidence}% confidence</span>
    <span class="chip">Owner: ${esc(b.source.owner)}</span>`;
  meta.style.marginBottom = "18px";
  head.appendChild(meta);
  page.appendChild(head);

  const card = el("div","card");
  b.assets.forEach(a => card.appendChild(assetRow(b, a)));
  page.appendChild(card);

  /* uploading is a write, so it follows the same gate as everything else */
  const add = el("div","section");
  add.innerHTML = `<div class="sec-head"><h3 style="font-size:15px">Add files</h3></div>
    <p class="sec-sub">Logos, icons, packaging artwork, anything the guide refers to but doesn't contain. ${ACCEPT_LABEL}.</p>`;

  if (!state.admin){
    const btn = el("button","btn btn-primary","Log in to add files");
    btn.onclick = () => openLogin("You need admin access to add files.");
    add.appendChild(btn);
    page.appendChild(add);
    return;
  }

  const drop = el("div","drop drop-inline");
  drop.tabIndex = 0;
  drop.setAttribute("role","button");
  drop.setAttribute("aria-label","Choose files to upload");
  drop.innerHTML = `<div class="big">⬆</div><b>Drop files here</b>
    <span>or click to choose · ${ACCEPT_LABEL} · up to 50 MB each</span>`;
  const input = el("input"); input.type = "file"; input.multiple = true;
  input.accept = ACCEPT_EXT.map(e => "." + e).join(","); input.hidden = true;

  drop.onclick = () => input.click();
  drop.onkeydown = e => { if (e.key==="Enter" || e.key===" "){ e.preventDefault(); input.click(); } };
  input.onchange = () => { attachFiles(b, input.files); input.value = ""; };
  ["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => attachFiles(b, e.dataTransfer.files));

  add.appendChild(drop);
  add.appendChild(input);
  page.appendChild(add);
}

const ACCEPT_EXT = ["svg","eps","ai","pdf","png","jpg","jpeg","webp","gif","zip","otf","ttf","woff2","ase"];
const ACCEPT_LABEL = "SVG, EPS, AI, PDF, PNG, JPG and more";
const PREVIEWABLE = ["svg","png","jpg","jpeg","webp","gif"];
const fileSize = n => n >= 1048576 ? (n/1048576).toFixed(1) + " MB"
                    : n >= 1024 ? Math.round(n/1024) + " KB" : n + " B";

function assetRow(b, a){
  const row = el("div","file-row");
  const ext = (a.name.split(".").pop() || "").toLowerCase();
  const thumb = a.url && PREVIEWABLE.includes(ext)
    ? `<span class="file-ico file-thumb"><img src="${a.url}" alt=""></span>`
    : `<span class="file-ico">${esc(a.kind)}</span>`;
  row.innerHTML = `${thumb}
    <span class="file-meta"><b>${esc(a.name)}</b><span>${esc(a.meta)}</span></span>
    ${a.uploaded ? '<span class="sb-pip pip-new">Added</span>' : ""}
    <button class="btn btn-ghost">Copy link</button>
    <button class="btn">Download</button>`;
  const [copyBtn, dlBtn] = row.querySelectorAll("button");
  copyBtn.onclick = () => copy(`https://spectra.design/d/${b.id}/${a.name}`, `link to ${a.name}`);
  dlBtn.onclick = () => {
    if (!a.url) return toast("Mockup — no file attached", a.name, null, true);
    const link = el("a"); link.href = a.url; link.download = a.name;
    document.body.appendChild(link); link.click(); link.remove();
    toast("Downloading", a.name);
  };
  return row;
}

/* Files stay in the browser as object URLs — enough for the download and the
   thumbnail to genuinely work. A real build PUTs them to object storage. */
function attachFiles(b, fileList){
  const files = [...(fileList || [])];
  if (!files.length) return;
  const ok = [], bad = [];
  files.forEach(f => {
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    if (!ACCEPT_EXT.includes(ext)) return bad.push(f.name);
    b.assets.push({
      name: f.name,
      kind: ext.slice(0,4).toUpperCase(),
      meta: `${fileSize(f.size)} · added just now by Studio Admin`,
      url: URL.createObjectURL(f),
      uploaded: true
    });
    ok.push(f.name);
  });
  if (ok.length) toast(`Added ${ok.length} file${ok.length>1?"s":""}`, ok.join(", "));
  if (bad.length) toast(`Skipped ${bad.length} unsupported file${bad.length>1?"s":""}`, bad.join(", "), null, true);

}

function openLogin(msg){

function closeAll(){ document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("open")); }
function showLoginError(msg){

/* Signing in and being an admin are deliberately separate. The first is
   "who are you", the second is a row in the admins table. */
async function isAdminUser(user){
  try{
    const { data, error } = await SB.from("admins").select("user_id").eq("user_id", user.id).maybeSingle();
    if (error) { console.warn("admin check failed:", error.message); return false; }
    return !!data;
  }catch(e){ console.warn("admin check failed:", e); return false; }
}

async function adoptSession(session, announce){
  state.user = session ? session.user : null;
  state.admin = false;
  if (session){
    state.admin = await isAdminUser(session.user);
    if (announce){
      if (state.admin) toast("Signed in", session.user.email);
      else toast("Signed in, but not an admin", "ask an admin to add you", null, true);
    }
  }
  renderAll();
}

async function signInWithPassword(email, password){
  const btn = $("#loginSubmit");
  btn.disabled = true; btn.textContent = "Signing in…";
  showLoginError("");
  try{
    const { data, error } = await SB.auth.signInWithPassword({ email, password });
    if (error){
      showLoginError(
        /invalid login/i.test(error.message)
          ? "That email and password don't match an account in this project."
          : /email not confirmed/i.test(error.message)
          ? "That account hasn't confirmed its email address yet. Confirm it in Supabase under Authentication → Users."
          : error.message
      );
      return;
    }
    closeAll();
    await adoptSession(data.session, true);
  }catch(e){
    /* a paused free project, a wrong URL, or no internet all land here */
    showLoginError("Couldn't reach Supabase. Check the project is running and that config.js has the right URL.");
    console.warn(e);
  }finally{
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

function demoSignIn(how){
  state.admin = true; state.user = { email: "studio@spectra.design" };
  closeAll(); renderAll();
  toast(how ? `Signed in with ${how}` : "Signed in as Studio Admin", "demo — publish + edit unlocked");
}

async function signOut(){
  if (LIVE){ try{ await SB.auth.signOut(); }catch(e){ console.warn(e); } }
  state.admin = false; state.user = null;
  renderAll();
  toast("Signed out", "back to read-only");
}

$("#loginForm").addEventListener("submit", e => {
  e.preventDefault();
  const email = $("#loginEmail").value.trim(), password = $("#loginPass").value;
  if (LIVE) signInWithPassword(email, password);
  else demoSignIn();
});
document.querySelectorAll("[data-sso]").forEach(b => b.onclick = () => demoSignIn(b.dataset.sso));

/* Come back to a still-valid session instead of making people sign in again. */
async function restoreSession(){
  if (!LIVE) return;
  try{
    const { data } = await SB.auth.getSession();
    if (data && data.session) await adoptSession(data.session, false);
  }catch(e){ console.warn("session restore failed:", e); }
}

/* =============================================================
   9. UPLOAD + EXTRACTION
   The demo derives a palette from the actual bytes of the file
   you drop, so two different PDFs give two different brands.
   A production build parses the page content instead.
   ============================================================= */
const PIPELINE = [
  ["Uploading to private storage", 520],
  ["Splitting 1 PDF into pages", 620],
  ["Reading text and embedded font names", 760],
  ["Sampling fills and vector art for colour", 880],
  ["Grouping colours into primary / secondary / neutral", 700],
  ["Matching type roles to print and digital use", 640],
  ["Finding logo lockups and usage rules", 580],
  ["Scoring confidence per field", 420]
];

const wait = ms => new Promise(r => setTimeout(r, ms));
let jobSeq = 0;

/* Extraction is a background job: submitting returns immediately and the
   queue keeps running whether or not anyone is watching the portal. */
async function submitJob(file){
  const job = {
    id: "job-" + (++jobSeq),
    name: file ? file.name : "sample-brand-guide.pdf",
    size: file ? fileSize(file.size) : "9.6 MB",
    stage: 0, status: "running", started: Date.now(), file
  };
  state.jobs.unshift(job);
  logActivity("Uploaded", job.name);
  toast("Extraction queued", job.name);
  if (state.view === "admin") renderAll();

  const seedPromise = file ? seedFromFile(file) : Promise.resolve(
    { seed: Math.floor(Math.random()*1e9), name:"Sample Studio", file:job.name, pages:34, size:job.size });

  for (let i = 0; i < PIPELINE.length; i++){
    job.stage = i;
    paintJob(job);
    await wait(PIPELINE[i][1]);
  }
  job.draft = proposeBrand(await seedPromise);
  job.status = "review";
  job.stage = PIPELINE.length;
  job.finished = Date.now();
  logActivity("Extraction finished", `${job.name} · ${job.draft.source.confidence}% confidence`);
  if (state.view === "admin") renderAll(true);
  else toast("Ready for review", job.draft.name);
}

/* Update one card in place — a full re-render on every stage would fight
   the admin's scroll position. */
function paintJob(job){
  const node = document.querySelector(`[data-job="${job.id}"]`);
  if (node) node.innerHTML = jobCardHTML(job);
}

function jobCardHTML(job){
  const total = PIPELINE.length;
  const pct = Math.round((job.stage / total) * 100);
  const done = job.status === "review";
  const label = done ? "Extraction complete" : PIPELINE[job.stage][0];
  return `<div class="job-head">
      <span class="file-ico">PDF</span>
      <span class="file-meta"><b>${esc(job.name)}</b><span>${esc(job.size)} · submitted ${timeAgo(job.started)}</span></span>
      <span class="chip ${done ? "good" : ""}">${done ? "Awaiting review" : "Processing"}</span>
    </div>
    <div class="bar"><i style="width:${done ? 100 : pct}%"></i></div>
    <div class="job-stage">${done ? "✓" : '<span class="spin"></span>'}
      <span>${esc(label)}</span>
      <span class="ms mono" style="margin-left:auto">${done ? total + "/" + total : job.stage + "/" + total} steps</span>
    </div>`;
}

const timeAgo = t => {
  const s = Math.round((Date.now() - t)/1000);
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s/60)}m ago` : `${Math.round(s/3600)}h ago`;
};
function logActivity(action, detail){
  state.activity.unshift({ t: Date.now(), who: state.admin ? "Studio Admin" : "Guest", action, detail });
}

/* Deterministic seed from the first 64 KB of the dropped file. */
function seedFromFile(file){
  return file.slice(0, 65536).arrayBuffer().then(buf => {
    const bytes = new Uint8Array(buf);
    let h = 0x811c9dc5;
    for (let i=0;i<bytes.length;i++){ h ^= bytes[i]; h = Math.imul(h, 0x01000193) >>> 0; }
    const base = file.name.replace(/\.pdf$/i,"").replace(/[-_]+/g," ")
      .replace(/\b(brand|guide|guidelines|identity|standards|book|final|draft|v?\d+(\.\d+)?)\b/gi,"")
      .trim().replace(/\s+/g," ");
    const name = (base || "Untitled Brand").replace(/\b\w/g, c => c.toUpperCase());
    return { seed:h, name, file:file.name, pages: 12 + (h % 70), size:(file.size/1048576).toFixed(1) + " MB" };
  }).catch(() => ({ seed:Date.now()>>>0, name:"Untitled Brand", file:file.name, pages:24, size:"—" }));
}

const TYPE_PAIRS = [
  { display:"Fraunces Semibold", body:"Public Sans Regular", dStack:"'Fraunces',Georgia,'Times New Roman',serif", bStack:"'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" },
  { display:"Source Serif 4 Semibold", body:"Inter Regular", dStack:"'Source Serif 4',Georgia,'Times New Roman',serif", bStack:"'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" },
  { display:"Archivo Black", body:"Inter Regular", dStack:"'Archivo Black',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif", bStack:"'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" },
  { display:"Atkinson Hyperlegible Bold", body:"Atkinson Hyperlegible Regular", dStack:"'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif", bStack:"'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" }
];

function proposeBrand(meta){
  let s = meta.seed;
  const rnd = () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296;
  const h = Math.floor(rnd()*360);
  const items = [
    { name:"Primary",   hex:hsl2hex(h, 62 + rnd()*22, 30 + rnd()*14), conf: 88 + Math.floor(rnd()*11) },
    { name:"Primary Dark", hex:hsl2hex(h, 40 + rnd()*20, 12 + rnd()*8), conf: 84 + Math.floor(rnd()*12) },
    { name:"Accent",    hex:hsl2hex((h + 150 + rnd()*60) % 360, 68 + rnd()*20, 48 + rnd()*10), conf: 71 + Math.floor(rnd()*20) },
    { name:"Support",   hex:hsl2hex((h + 40) % 360, 30 + rnd()*18, 76 + rnd()*10), conf: 66 + Math.floor(rnd()*22) },
    { name:"Paper",     hex:hsl2hex(h, 14, 96), conf: 92 + Math.floor(rnd()*7) },
    { name:"Ink",       hex:hsl2hex(h, 12, 13), conf: 94 + Math.floor(rnd()*5) }
  ];
  const pair = TYPE_PAIRS[Math.floor(rnd()*TYPE_PAIRS.length)];
  const words = meta.name.split(" ");
  const monogram = (words.length>1 ? words[0][0]+words[1][0] : meta.name.slice(0,2)).toUpperCase();
  const conf = Math.round(items.reduce((n,i)=>n+i.conf,0)/items.length);

  return {
    id: slug(meta.name) + "-" + (meta.seed % 997),
    name: meta.name, short: words[0], monogram, mark: meta.seed % 4, status:"review",
    tagline:"Extracted from " + meta.file + ". Nothing here is approved yet.",
    source:{ file:meta.file, pages:meta.pages, size:meta.size, extracted:new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}), confidence:conf, owner:"Studio Admin" },
    _proposed: items,
    colors:[
      { group:"Primary", items: items.slice(0,2).map(i => ({ name:i.name, hex:i.hex, note:"Detected on "+(1+(meta.seed%6))+" pages as a dominant fill." })) },
      { group:"Secondary", items: items.slice(2,4).map(i => ({ name:i.name, hex:i.hex, note:"Appears in charts and supporting graphics." })) },
      { group:"Neutrals", items: items.slice(4).map(i => ({ name:i.name, hex:i.hex, note:"Background and body copy." })) }
    ],
    type:{
      digital:[
        { role:"Display", family:pair.display, stack:pair.dStack, weight:700,
          specs:{ Size:"42px", Leading:"46px", Tracking:"-0.02em", Source:"Embedded font table" },
          sample:meta.name, usage:"Detected as the largest recurring style in the guide. Verify against the type pages." },
        { role:"Body", family:pair.body, stack:pair.bStack, weight:400,
          specs:{ Size:"16px", Leading:"25px", Tracking:"0", Source:"Embedded font table" },
          sample:"Running text set in the body face named in the guide's font table.", usage:"Detected as the dominant body style. Confirm the licensed weights before publishing." }
      ],
      print:[
        { role:"Display", family:pair.display, stack:pair.dStack, weight:700,
          specs:{ Size:"32 pt", Leading:"36 pt", Tracking:"-8", Source:"Derived from page geometry" },
          sample:meta.name, usage:"Point sizes derived from the page trim size — treat as a starting point, not a specification." },
        { role:"Body", family:pair.body, stack:pair.bStack, weight:400,
          specs:{ Size:"9.5 pt", Leading:"14 pt", Tracking:"0", Source:"Derived from page geometry" },
          sample:"Running text set in the body face named in the guide's font table.", usage:"Confirm against the printed guide before sending anything to press." }
      ]
    },
    logo:{
      minPrint:"20 mm wide", minDigital:"88 px wide",
      clearspace:"Detected as roughly half the mark height. Confirm with the guide.",
      dos:["Primary colour on Paper","Reversed to Paper on Primary"],
      donts:["Publish before the extraction is reviewed","Send derived CMYK values to a printer unchecked"]
    },
    assets:[
      { name:slug(meta.name)+"-palette.ase", kind:"ASE", meta:"Adobe swatch exchange · "+items.length+" colours" },
      { name:slug(meta.name)+"-tokens.json", kind:"JSON", meta:"Design tokens · W3C format" },
      { name:meta.file, kind:"PDF", meta:"Source document · "+meta.pages+" pages · "+meta.size }
    ]
  };
}

function adminUpload(page){
  const head = el("div","section");
  head.innerHTML = `<div class="sec-head"><h3>Add a brand guide</h3></div>
    <p class="sec-sub">Drop one or more brand guide PDFs. Each becomes a background job — you can leave this page while they run, and nothing reaches the library until you approve it.</p>`;
  page.appendChild(head);

  const drop = el("div","drop");
  drop.tabIndex = 0; drop.setAttribute("role","button"); drop.setAttribute("aria-label","Choose brand guide PDFs");
  drop.innerHTML = `<div class="big">📄</div><b>Drop brand guide PDFs</b>
    <span>or click to choose · PDF only · up to 100 MB each</span>`;
  const input = el("input"); input.type = "file"; input.accept = "application/pdf,.pdf";
  input.multiple = true; input.hidden = true;

  const submit = files => {
    const list = [...(files||[])].filter(f => /\.pdf$/i.test(f.name));
    const bad  = [...(files||[])].length - list.length;
    list.forEach(submitJob);
    if (bad) toast(`Skipped ${bad} non-PDF file${bad>1?"s":""}`, "brand guides must be PDFs", null, true);
    if (list.length){ state.tab = "queue"; renderAll(); }
  };
  drop.onclick = () => input.click();
  drop.onkeydown = e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); input.click(); } };
  input.onchange = () => { submit(input.files); input.value = ""; };
  ["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => submit(e.dataTransfer.files));
  page.appendChild(drop);
  page.appendChild(input);

  const row = el("div","meta-row"); row.style.marginTop = "14px";
  const sample = el("button","btn","Run a sample guide instead");
  sample.onclick = () => { submitJob(null); state.tab = "queue"; renderAll(); };
  row.appendChild(sample);
  row.appendChild(el("span","hint",`No file leaves your browser in this mockup.`));
  page.appendChild(row);

  const steps = el("div","section");
  steps.innerHTML = `<div class="sec-head"><h3 style="font-size:15px">What happens after you drop it</h3></div>
    <div class="ov-grid">
      <div class="card ov-card"><span class="eyebrow">1 · Stored</span><span class="ov-note">The PDF goes to private storage and gets a job ticket. Nobody browsing the library can see it.</span></div>
      <div class="card ov-card"><span class="eyebrow">2 · Read</span><span class="ov-note">A worker pulls the text layer, embedded font table and vector fills — the values the file already knows.</span></div>
      <div class="card ov-card"><span class="eyebrow">3 · Sorted</span><span class="ov-note">A model groups colours, matches type roles and finds the logo rules, scoring its confidence per field.</span></div>
      <div class="card ov-card"><span class="eyebrow">4 · Your call</span><span class="ov-note">It lands in Needs review. You publish it, keep it as a draft, or discard it.</span></div>
    </div>`;
  page.appendChild(steps);
}

function adminQueue(page){
  const jobs = state.jobs.filter(j => j.status === "running");
  const head = el("div","section");
  head.innerHTML = `<div class="sec-head"><h3>Processing</h3><span class="count">${jobs.length} running</span></div>
    <p class="sec-sub">Each job runs the same pipeline. Timings here are illustrative; a real 90-page guide takes a few minutes.</p>`;

function adminReview(page){
  const jobs = state.jobs.filter(j => j.status === "review");
  const head = el("div","section");
  head.innerHTML = `<div class="sec-head"><h3>Needs review</h3><span class="count">${jobs.length} waiting</span></div>
    <p class="sec-sub">What the extraction proposes, and how sure it is. Everything marked ⚙ was calculated rather than read off the page — check those before anything goes to a printer.</p>`;
  page.appendChild(head);

  if (!jobs.length){
    page.appendChild(el("div","empty","Nothing waiting. Finished extractions land here for approval."));
    return;
  }

  jobs.forEach(job => {
    const d = job.draft;
    const low = d._proposed.filter(c => c.conf < 75).length;
    const card = el("div","job");
    card.innerHTML = `<div class="job-head">
        <span class="file-ico">PDF</span>
        <span class="file-meta"><b>${esc(d.name)}</b><span>${esc(job.name)} · ${d.source.pages} pages · extracted ${timeAgo(job.finished)}</span></span>
        <span class="chip ${d.source.confidence>=90?"good":d.source.confidence>=80?"warn":"bad"}">${d.source.confidence}% confidence</span>
        ${low ? `<span class="flag">${low} field${low>1?"s":""} to check</span>` : ""}
      </div>
      <div class="rev-grid">
        <div>
          <div class="eyebrow" style="margin-bottom:8px">Proposed palette · ${d._proposed.length}</div>
          ${d._proposed.map(c => {
            const tone = c.conf>=85 ? "good" : c.conf>=70 ? "warn" : "bad";
            return `<div class="rev-row">
              <i class="rev-sw" style="background:${c.hex}"></i>
              <span class="rev-meta"><b>${esc(c.name)}</b><span>${c.hex} · ${cmykStr(c.hex)} CMYK ⚙</span></span>
              <span class="conf" style="background:var(--${tone}-soft);color:var(--${tone})">${c.conf}%</span>
            </div>`;
          }).join("")}
        </div>
        <div>
          <div class="eyebrow" style="margin-bottom:8px">Proposed type</div>
          <div class="rev-row"><span class="rev-meta"><b style="font-family:${d.type.digital[0].stack}">${esc(d.type.digital[0].family)}</b><span>display · from the embedded font table</span></span></div>
          <div class="rev-row"><span class="rev-meta"><b style="font-family:${d.type.digital[1].stack}">${esc(d.type.digital[1].family)}</b><span>body · from the embedded font table</span></span></div>
          <div class="eyebrow" style="margin:16px 0 8px">Proposed logo rules</div>
          <div class="rev-row"><span class="rev-meta"><b>${esc(d.logo.minDigital)} / ${esc(d.logo.minPrint)}</b><span>minimum size, screen and print ⚙</span></span></div>
        </div>
      </div>`;

    const acts = el("div","meta-row"); acts.style.marginTop = "14px";
    const pub = el("button","btn btn-primary","Approve and publish");
    pub.onclick = () => finishJob(job, "published");
    const draft = el("button","btn","Keep as draft");
    draft.onclick = () => finishJob(job, "review");
    const kill = el("button","btn btn-ghost","Discard");
    kill.onclick = () => {
      state.jobs = state.jobs.filter(j => j !== job);
      logActivity("Discarded extraction", d.name);
      toast("Discarded", d.name, null, true);
      renderAll(true);
    };
    acts.append(pub, draft, kill);
    card.appendChild(acts);
    page.appendChild(card);
  });
}

function finishJob(job, status){
  const d = job.draft;
  delete d._proposed;
  d.status = status;
  state.brands.push(d);
  state.jobs = state.jobs.filter(j => j !== job);
  logActivity(status === "published" ? "Published" : "Saved as draft", d.name);
  toast(status === "published" ? "Published to the library" : "Saved as a draft", d.name, allColors(d)[0].hex);
  go(d.id);
}

function adminBrands(page){
  const head = el("div","section");
  head.innerHTML = `<div class="sec-head"><h3>Brands</h3><span class="count">${state.brands.length}</span></div>
    <p class="sec-sub">Everything in the library. Unpublishing hides a brand from everyone but admins — useful when a guide is being reissued.</p>`;
  page.appendChild(head);

  const wrap = el("div","tbl-wrap");
  const tbl = el("table","tbl");
  tbl.innerHTML = `<thead><tr>
      <th>Brand</th><th>Status</th><th>Colours</th><th>Type</th><th>Files</th><th>Owner</th><th>Confidence</th><th></th>
    </tr></thead>`;
  const body = el("tbody");
  state.brands.forEach(b => {
    const tr = el("tr");
    tr.innerHTML = `<td class="name">${esc(b.name)}</td>
      <td><span class="sb-pip ${b.status==="published"?"pip-new":"pip-review"}">${b.status==="published"?"Published":"Draft"}</span></td>
      <td class="mono">${allColors(b).length}</td>
      <td class="mono">${b.type.digital.length + b.type.print.length}</td>
      <td class="mono">${b.assets.length}</td>
      <td>${esc(b.source.owner)}</td>
      <td class="mono">${b.source.confidence}%</td>
      <td class="row-actions"></td>`;
    const actions = tr.querySelector(".row-actions");
    const open = el("button","btn btn-ghost","Open");
    open.onclick = () => go(b.id);
    const toggle = el("button","btn", b.status === "published" ? "Unpublish" : "Publish");
    toggle.onclick = () => {
      b.status = b.status === "published" ? "review" : "published";
      logActivity(b.status === "published" ? "Published" : "Unpublished", b.name);
      toast(b.status === "published" ? "Published" : "Unpublished", b.name);
      renderAll(true);
    };
    const del = el("button","btn btn-danger","Delete");
    del.onclick = () => openDeleteBrand(b);
    actions.append(open, toggle, del);
    body.appendChild(tr);
  });
  tbl.appendChild(body);
  wrap.appendChild(tbl);
  page.appendChild(wrap);
}

/* Deleting a brand takes its whole record with it, so the dialog spells out
   what goes and asks for the name to be typed. Only reachable from the admin
   portal — deliberately not a button sitting next to everyday controls. */
let pendingDelete = null;

function openDeleteBrand(brand){
  if (!state.admin) return openLogin("You need admin access to delete a brand.");
  pendingDelete = brand;
  const files = brand.assets.length;
  $("#delSub").textContent = `${brand.name} — ${brand.status === "published" ? "currently published" : "a draft"}.`;
  $("#delSummary").innerHTML = `<b>This removes everything:</b>
    <ul>
      <li>${allColors(brand).length} colours, with their stated CMYK and Pantone values</li>
      <li>${brand.type.digital.length + brand.type.print.length} type styles across print and digital</li>
      <li>${brand.logo.dos.length + brand.logo.donts.length} logo rules, clear space and minimum sizes</li>
      <li>${files} file${files === 1 ? "" : "s"}, including the source guide</li>
    </ul>`;
  const input = $("#delConfirm"), btn = $("#delConfirmBtn");
  input.value = ""; btn.disabled = true;
  input.oninput = () => { btn.disabled = input.value.trim() !== brand.name; };
  $("#deleteModal").classList.add("open");
  setTimeout(() => input.focus(), 60);
}

function deleteBrand(brand){
  /* release any object URLs held by uploaded assets so they don't leak */
  brand.assets.forEach(a => { if (a.url) URL.revokeObjectURL(a.url); });
  state.brands = state.brands.filter(b => b !== brand);
  logActivity("Deleted", brand.name);
  toast("Deleted", brand.name, null, true);
  closeAll();
  pendingDelete = null;
  /* if you were looking at it, you can't stay there */
  if (state.view === brand.id) go("admin", "brands");
  else renderAll(true);
}

$("#delCancel").onclick = () => { pendingDelete = null; closeAll(); };
$("#delConfirmBtn").onclick = () => { if (pendingDelete) deleteBrand(pendingDelete); };
$("#delConfirm").addEventListener("keydown", e => {
  if (e.key === "Enter" && !$("#delConfirmBtn").disabled){ e.preventDefault(); $("#delConfirmBtn").click(); }
});

function adminActivity(page){
  const head = el("div","section");
  head.innerHTML = `<div class="sec-head"><h3>Activity</h3><span class="count">${state.activity.length} events</span></div>
    <p class="sec-sub">Who did what, and when. In a real build this is the audit trail — it answers "who approved this palette?" months later.</p>`;
  page.appendChild(head);

  if (!state.activity.length){
    page.appendChild(el("div","empty","Nothing yet. Uploads, approvals and publishes are recorded here."));
    return;
  }
  const card = el("div","card"); card.style.padding = "6px 16px";
  const list = el("ul","log");
  state.activity.forEach(a => {
    const li = el("li");
    li.innerHTML = `<time>${new Date(a.t).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"})}</time>
      <span><span class="who">${esc(a.who)}</span> ${esc(a.action.toLowerCase())} — ${esc(a.detail)}</span>`;
    list.appendChild(li);
  });
  card.appendChild(list);
  page.appendChild(card);
}

/* =============================================================
   10. WIRING
   ============================================================= */
function go(view, tab){
  state.view = view;
  state.tab = tab || (view === "home" ? "all" : view === "admin" ? "upload" : "logo");
  document.body.classList.remove("nav-open");
  renderAll();
}
function renderAll(keepScroll){
  /* signing out while viewing an unapproved brand — or the portal — drops you back */
  const current = brandById(state.view);
  if (current && !visibleBrands().includes(current)){ state.view = "home"; state.tab = "all"; }
  if (state.view === "admin" && !state.admin){ state.view = "home"; state.tab = "all"; }
  renderSidebar(); renderHeader(); renderPage(keepScroll);
}

$("#search").addEventListener("input", e => { state.query = e.target.value; renderSidebar(); });
$("#menuBtn").onclick = () => document.body.classList.toggle("nav-open");
$("#scrim").onclick  = () => document.body.classList.remove("nav-open");
$("#themeBtn").onclick = () => {
  const dark = state.theme ? state.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  state.theme = dark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", state.theme);
  toast(`${state.theme === "dark" ? "Dark" : "Light"} theme`, null, null, false);
};
document.querySelectorAll(".overlay").forEach(o => o.addEventListener("mousedown", e => { if (e.target === o) closeAll(); }));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeAll();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#search").focus(); $("#search").select(); }
});

paintMode();
renderAll();
restoreSession();
</script>
</body>
